name: URA 2026 H1 locked line-pair confirmation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ura-322-2026-locked.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  locked-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check immutable models and 61 existing core/research tests
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python -m unittest discover -s research/line_patterns_20261025 -p 'test_*.py' -v
          test "$(git hash-object artifacts/ura_ai_v1.json)" = 5a353643cfe8196ab695521d479237294c3f9b66
          python - <<'PY'
          from research.line_patterns_20261025.verify_2026 import FAMILIES,PROBES
          assert FAMILIES==('12','23','13')
          assert PROBES=={'12':'2H-2B-3B|12','23':'2H-3H-3B|23','13':'3B-2H-3T|13'}
          PY
      - name: Restore original March 2026 frozen model and historical archive
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_PASSPHRASE"
          mkdir -p fixed_inputs db
          gh release download haruqube-20260321-flagship-v1 --repo yuhevita-wq/haruq -p haruqube_20260321_fresh_model.pkl -D fixed_inputs/
          gh release download haruqube-20260321-history-cache-live --repo yuhevita-wq/haruq -p keirin-history.sqlite.gpg -D fixed_inputs/
          gh release download haruqube-20260321-history-cache-live --repo yuhevita-wq/haruq -p ENCRYPTED_SHA256SUMS.txt -D fixed_inputs/
          gh release download haruqube-20260321-history-cache-live --repo yuhevita-wq/haruq -p PLAINTEXT_SHA256.txt -D fixed_inputs/
          (cd fixed_inputs && sha256sum -c ENCRYPTED_SHA256SUMS.txt)
          test "$(sha256sum fixed_inputs/haruqube_20260321_fresh_model.pkl | cut -d' ' -f1)" = e70690f4538b77e927a042e7ae2db312f8a0a4f16bf72def37e7ccad3568c193
          printf '%s' "$COLLECTOR_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --output db/keirin.db --decrypt fixed_inputs/keirin-history.sqlite.gpg
          (cd db && sha256sum -c ../fixed_inputs/PLAINTEXT_SHA256.txt)
      - name: Acquire complete archived 2026 trifecta odds (unchanged)
        run: |
          set -euo pipefail
          curl -fLSs --retry 4 --max-time 240 -o fixed_inputs/odds_2026.jsonl.gz https://raw.githubusercontent.com/yuhevita-wq/keirin-market-analysis-/main/data/odds_only/odds_2026.jsonl.gz
          gzip -t fixed_inputs/odds_2026.jsonl.gz
          test "$(sha256sum fixed_inputs/odds_2026.jsonl.gz | cut -d' ' -f1)" = 90a8ed4eb65ec1dc310698bcf08121965764b63750c6560edd9734869e8f6e94
      - name: Recover frozen-rank LOW seven-bike 2026H1 labels without using 2026 for model fitting
        run: |
          set -euo pipefail
          python -u -m research.line_patterns_20261025.extract_2026 --model fixed_inputs/haruqube_20260321_fresh_model.pkl --odds fixed_inputs/odds_2026.jsonl.gz --out 2026_labels
          test -s 2026_labels/year_2026H1.csv
      - name: Test locked 1-2/2-3/1-3 relation families and three predeclared role structures
        run: |
          set -euo pipefail
          python -u -m research.line_patterns_20261025.verify_2026 --input 2026_labels/year_2026H1.csv --out locked_322_results
          test -s locked_322_results/summary.json
          python - <<'PY'
          import json
          j=json.load(open('locked_322_results/summary.json'))
          assert not j['purchase_approved'] and j['frozen_2_2_2_1_untouched']
          assert j['selections_locked_before_2026_label_scan']
          assert j['lineup_audit']['ok']>0
          assert len(j['family_stats'])==6
          PY
      - name: Archive evidence and research ledgers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ura-322-2026H1-locked-three-family-validation
          path: |
            2026_labels/extract_2026_audit.json
            locked_322_results/
          retention-days: 90
          if-no-files-found: error
      - name: Remove decrypted historical data
        if: always()
        run: rm -f db/keirin.db fixed_inputs/haruqube_20260321_fresh_model.pkl fixed_inputs/keirin-history.sqlite.gpg fixed_inputs/odds_2026.jsonl.gz
