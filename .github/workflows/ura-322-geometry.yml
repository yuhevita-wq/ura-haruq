name: URA 3-2-2 outcome-first geometry (frozen)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ura-322-geometry.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frozen URA + geometry tests
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python -m unittest discover -s research/line_patterns_20261025 -p 'test_*.py' -v
          test "$(git hash-object artifacts/ura_ai_v1.json)" = 5a353643cfe8196ab695521d479237294c3f9b66
      - uses: actions/download-artifact@v4
        with:
          run-id: 40056803172
          github-token: ${{ github.token }}
          pattern: v3-year-*
          merge-multiple: true
          path: v3_input/
      - name: Verify input
        run: |
          for y in 2023 2024 2025; do test -s "v3_input/year_$y.csv"; done
      - name: Restore unmodified archive
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_PASSPHRASE"
          mkdir -p fixed_inputs db
          gh release download haruqube-20260321-history-cache-live --repo yuhevita-wq/haruq -p keirin-history.sqlite.gpg -D fixed_inputs/
          gh release download haruqube-20260321-history-cache-live --repo yuhevita-wq/haruq -p ENCRYPTED_SHA256SUMS.txt -D fixed_inputs/
          gh release download haruqube-20260321-history-cache-live --repo yuhevita-wq/haruq -p PLAINTEXT_SHA256.txt -D fixed_inputs/
          (cd fixed_inputs && sha256sum -c ENCRYPTED_SHA256SUMS.txt)
          printf '%s' "$COLLECTOR_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --output db/keirin.db --decrypt fixed_inputs/keirin-history.sqlite.gpg
          (cd db && sha256sum -c ../fixed_inputs/PLAINTEXT_SHA256.txt)
      - name: Outcome-first exhaustive 3-2-2 geometry audit
        run: |
          set -euo pipefail
          python -u -m research.line_patterns_20261025.geometry_322 --input v3_input --out geometry322
          test -s geometry322/summary.json
          test -s geometry322/complete_structural_roi_by_year.csv
          test -s geometry322/observed_winning_geometry.csv
          python - <<'PY'
          import json
          j=json.load(open('geometry322/summary.json'))
          assert j["original_frozen_2221_modified"] is False
          assert j["rank_based_heads_in_geometry"] is False
          assert j["purchase_approved"] is False
          assert j["processed_by_year"]["2025"]>2000
          print("VALID_322",j["processed_by_year"],"geometry_types",j["candidate_count"])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ura-322-outcome-first-geometry-2023-2025
          path: geometry322/
          if-no-files-found: error
          retention-days: 90
      - name: Delete decrypted archive
        if: always()
        run: rm -f db/keirin.db fixed_inputs/keirin-history.sqlite.gpg
