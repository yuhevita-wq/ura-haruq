name: External April-May 2026 frozen formation ROI validation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ura-external-roi.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ura-formation-external-apr-may
  cancel-in-progress: false
jobs:
  frozen-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inference dependencies and check all tests
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Assert all trained models are immutable
        run: |
          set -euo pipefail
          test "$(git hash-object artifacts/ura_ai_v1.json)" = 5a353643cfe8196ab695521d479237294c3f9b66
          python - <<'PY'
          import json
          a=json.load(open('artifacts/ura_shape_selector_v1.json'))
          b=json.load(open('artifacts/ura_marginal_v1.json'))
          assert a["training_split"]["races"]==242 and a["frozen_ura_git_blob"]=="5a353643cfe8196ab695521d479237294c3f9b66"
          assert b["fit_races"]==219 and b["frozen_ura_git_blob"]=="5a353643cfe8196ab695521d479237294c3f9b66"
          assert b["purchase_approved"] is False
          PY
      - name: Restore original encrypted race history and frozen original AI
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_PASSPHRASE"
          mkdir -p fixed_inputs db
          gh release download haruqube-20260321-flagship-v1 --repo yuhevita-wq/haruq -p haruqube_20260321_fresh_model.pkl -D fixed_inputs/
          gh release download haruqube-20260321-history-cache-live --repo yuhevita-wq/haruq -p keirin-history.sqlite.gpg -D fixed_inputs/
          gh release download haruqube-20260321-history-cache-live --repo yuhevita-wq/haruq -p ENCRYPTED_SHA256SUMS.txt -D fixed_inputs/
          gh release download haruqube-20260321-history-cache-live --repo yuhevita-wq/haruq -p PLAINTEXT_SHA256.txt -D fixed_inputs/
          ( cd fixed_inputs && sha256sum -c ENCRYPTED_SHA256SUMS.txt )
          test "$(sha256sum fixed_inputs/haruqube_20260321_fresh_model.pkl | cut -d' ' -f1)" = e70690f4538b77e927a042e7ae2db312f8a0a4f16bf72def37e7ccad3568c193
          printf '%s' "$COLLECTOR_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --output db/keirin.db --decrypt fixed_inputs/keirin-history.sqlite.gpg
          ( cd db && sha256sum -c ../fixed_inputs/PLAINTEXT_SHA256.txt )
      - name: Acquire independently archived 2026 April-May trifecta prices
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --max-time 180 -o fixed_inputs/odds_2026.jsonl.gz https://raw.githubusercontent.com/yuhevita-wq/keirin-market-analysis-/main/data/odds_only/odds_2026.jsonl.gz
          gzip -t fixed_inputs/odds_2026.jsonl.gz
          sha256sum fixed_inputs/odds_2026.jsonl.gz > fixed_inputs/archive_2026_sha256.txt
      - name: Score full frozen portfolio strategies and real payouts
        run: |
          set -euo pipefail
          python -u -m ura.formation_external_audit --model fixed_inputs/haruqube_20260321_fresh_model.pkl --odds fixed_inputs/odds_2026.jsonl.gz --out ura_external_audit
          cp fixed_inputs/archive_2026_sha256.txt ura_external_audit/odds_input_sha256.txt
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ura-april-may-2026-external-frozen-roi
          path: ura_external_audit/
          retention-days: 90
          if-no-files-found: error
      - if: always()
        run: rm -f db/keirin.db fixed_inputs/keirin-history.sqlite.gpg fixed_inputs/odds_2026.jsonl.gz fixed_inputs/haruqube_20260321_fresh_model.pkl
