name: URA independent odds archive probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ura-odds-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 2026 trifecta odds public archive schema without reading any secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 2 --max-time 120 \
            -o /tmp/odds_2026.jsonl.gz \
            https://raw.githubusercontent.com/yuhevita-wq/keirin-market-analysis-/main/data/odds_only/odds_2026.jsonl.gz
          python - <<'PY'
          import gzip,json,collections
          path='/tmp/odds_2026.jsonl.gz'
          with gzip.open(path,'rt',encoding='utf-8') as f:
              sample=[json.loads(next(f)) for i in range(5)]
          counts=collections.Counter()
          obs=0; win=0; formats=collections.Counter(); first={}
          with gzip.open(path,'rt',encoding='utf-8') as h:
              for raw in h:
                  it=json.loads(raw)
                  rid=str(it.get('race_id',''))
                  day=rid[2:10] if len(rid)==16 else rid[:8]
                  counts[day[:6]]+=1
                  formats[len(rid)]+=1
                  t=it.get('odds',{}).get('3連単',{})
                  if t:obs+=1
                  first.setdefault(day[:6],rid)
          from collections import defaultdict
          groups=defaultdict(list)
          with gzip.open(path,'rt',encoding='utf-8') as h:
              for raw in h:
                  obj=json.loads(raw);rid=str(obj.get('race_id',''))
                  if len(rid)!=16 or rid[2:8]!='202606':continue
                  key=rid[2:10]+rid[:2]+rid[-2:]
                  groups[key].append({'id':rid,'type':obj.get('race_type'),'n3':len(obj.get('odds',{}).get('3連単',{}))})
          repeated={k:v for k,v in groups.items() if len(v)>1}
          print('JUNE_KEY_GROUPS',len(groups),'DUPLICATE',len(repeated))
          for k,v in list(repeated.items())[:15]:print('COLLISION',k,str(v)[:640])
          print('ARCHIVE_MONTHS',dict(sorted(counts.items())))
          print('RACE_ID_LENGTHS',dict(formats),'WITH_TRIFECTA',obs,'EXAMPLE_RACE_IDS',first)
          for item in sample:
              print(json.dumps({'race_id':item.get('race_id'),'race_type':item.get('race_type'),
                 'odds_type':type(item.get('odds')).__name__,
                 'odds_keys':list(item.get('odds',{}).keys())[:15] if isinstance(item.get('odds'),dict) else [],
                 'odds_sample':str(item.get('odds'))[:400]},ensure_ascii=False))
          PY
